plugins {
    id 'com.android.application'
}

android {
    namespace 'com.viral.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.viral.launcher"
        minSdk 21
        targetSdk 28
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")
        versionName "1.0"
    }

    // fixed signing key so every build can update the previous one
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
